<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>WishCraft Genie</title>

    <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
  {
    "imports": {
      "three": "./lib/three/three.module.js",
      "three/addons/": "./lib/three/examples/jsm/",
      "three/examples/jsm/": "./lib/three/examples/jsm/"
    }
  }
  </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            background: transparent !important;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-app-region: drag;
            cursor: grab;
        }

        #avatar-container {
            width: 100%;
            height: calc(100% - 60px);
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            filter: drop-shadow(0 0 15px rgba(0, 200, 255, 0.4)) drop-shadow(0 0 30px rgba(100, 50, 255, 0.2));
            animation: float 3s ease-in-out infinite;
        }

        #avatar-container.visible {
            opacity: 1;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        #glow-ring {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle,
                    rgba(0, 200, 255, 0.12) 0%,
                    rgba(100, 50, 255, 0.06) 50%,
                    transparent 70%);
            animation: pulse 2s ease-in-out infinite;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #glow-ring.visible {
            opacity: 1;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.6;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.05);
                opacity: 1;
            }
        }

        /* Speech bubble — Frosted Glass */
        #speech-bubble {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 240px;
            padding: 10px 16px;
            background: rgba(20, 10, 50, 0.55);
            backdrop-filter: blur(24px) saturate(120%);
            -webkit-backdrop-filter: blur(24px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px 16px 16px 4px;
            font-size: 12px;
            line-height: 1.4;
            color: #f0eeff;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transform: translateX(-50%) translateY(10px) scale(0.9);
            transition: opacity 0.4s ease, transform 0.4s ease;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.15),
                inset 0 0 20px rgba(100, 80, 255, 0.05);
            -webkit-app-region: no-drag;
        }

        #speech-bubble.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        #speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 20px;
            width: 12px;
            height: 12px;
            background: rgba(20, 10, 50, 0.55);
            border-right: 1px solid rgba(255, 255, 255, 0.12);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            transform: rotate(45deg);
        }

        #status {
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0, 200, 255, 0.8);
            font-size: 10px;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(0, 200, 255, 0.4);
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
            -webkit-app-region: no-drag;
        }

        #status.visible {
            opacity: 1;
        }

        #avatar-actions {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 6px;
            -webkit-app-region: no-drag;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        body:hover #avatar-actions {
            opacity: 1;
        }

        .avatar-btn {
            background: rgba(20, 10, 50, 0.55);
            backdrop-filter: blur(20px) saturate(120%);
            -webkit-backdrop-filter: blur(20px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(220, 210, 255, 0.85);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.5);
            -webkit-app-region: no-drag;
            box-shadow:
                0 4px 16px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .avatar-btn:hover {
            background: rgba(30, 15, 70, 0.65);
            color: #f0eeff;
            border-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
            box-shadow:
                0 6px 20px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 0 12px rgba(100, 80, 255, 0.15);
        }

        #smoke-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* ========== Language Picker — Frosted Glass Overlay ========== */
        #lang-picker {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10, 5, 30, 0.7);
            backdrop-filter: blur(30px) saturate(130%);
            -webkit-backdrop-filter: blur(30px) saturate(130%);
            z-index: 200;
            animation: fadeIn 0.5s ease;
            -webkit-app-region: no-drag;
        }

        #lang-picker.hidden {
            display: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .lang-title {
            font-size: 14px;
            color: #f0eeff;
            margin-bottom: 6px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .lang-subtitle {
            font-size: 10px;
            color: rgba(180, 170, 220, 0.6);
            margin-bottom: 14px;
        }

        .lang-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            width: 220px;
        }

        .lang-btn {
            background: rgba(20, 10, 50, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f0eeff;
            padding: 8px 6px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.5);
            text-align: center;
            box-shadow:
                0 4px 16px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .lang-btn:hover {
            background: rgba(30, 15, 70, 0.65);
            border-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.03);
            box-shadow:
                0 6px 20px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 0 15px rgba(100, 80, 255, 0.15);
        }

        .lang-btn .lang-flag {
            font-size: 18px;
            display: block;
            margin-bottom: 2px;
        }

        .lang-btn .lang-name {
            font-size: 10px;
            opacity: 0.6;
        }
    </style>
</head>

<body>

    <canvas id="smoke-canvas"></canvas>
    <div id="glow-ring"></div>
    <div id="avatar-container"></div>
    <div id="status"></div>
    <div id="speech-bubble"></div>

    <!-- Language Picker (shown on first summon) -->
    <div id="lang-picker" class="hidden">
        <div class="lang-title">✨ Choose Your Language</div>
        <div class="lang-subtitle">Select how your genie speaks</div>
        <div class="lang-grid">
            <button class="lang-btn" data-lang="en"
                data-greeting="You have awakened me from the lamp… I am the Genie of WishCraft. What is your wish?">
                <span class="lang-flag">🇬🇧</span>English
                <span class="lang-name">English</span>
            </button>
            <button class="lang-btn" data-lang="bn"
                data-greeting="তুমি আমাকে প্রদীপ থেকে জাগিয়েছ… আমি WishCraft-এর জিনি। তোমার ইচ্ছা কী?">
                <span class="lang-flag">🇧🇩</span>বাংলা
                <span class="lang-name">Bangla</span>
            </button>
            <button class="lang-btn" data-lang="hi"
                data-greeting="तुमने मुझे दीपक से जगाया… मैं WishCraft का जिन्न हूँ। तुम्हारी इच्छा क्या है?">
                <span class="lang-flag">🇮🇳</span>हिन्दी
                <span class="lang-name">Hindi</span>
            </button>
            <button class="lang-btn" data-lang="ar"
                data-greeting="أيقظتني من المصباح... أنا جني WishCraft. ما هي أمنيتك؟">
                <span class="lang-flag">🇸🇦</span>العربية
                <span class="lang-name">Arabic</span>
            </button>
            <button class="lang-btn" data-lang="es"
                data-greeting="Me has despertado de la lámpara… Soy el Genio de WishCraft. ¿Cuál es tu deseo?">
                <span class="lang-flag">🇪🇸</span>Español
                <span class="lang-name">Spanish</span>
            </button>
            <button class="lang-btn" data-lang="zh" data-greeting="你把我从灯中唤醒了……我是WishCraft的精灵。你的愿望是什么？">
                <span class="lang-flag">🇨🇳</span>中文
                <span class="lang-name">Chinese</span>
            </button>
            <button class="lang-btn" data-lang="ja" data-greeting="ランプから目覚めさせてくれた…私はWishCraftのジーニーだ。お前の願いは何だ？">
                <span class="lang-flag">🇯🇵</span>日本語
                <span class="lang-name">Japanese</span>
            </button>
            <button class="lang-btn" data-lang="fr"
                data-greeting="Tu m'as réveillé de la lampe… Je suis le Génie de WishCraft. Quel est ton souhait?">
                <span class="lang-flag">🇫🇷</span>Français
                <span class="lang-name">French</span>
            </button>
        </div>
    </div>

    <!-- Action buttons (visible on hover) -->
    <div id="avatar-actions">
        <button class="avatar-btn" id="btn-chat" title="Open chat panel">💬</button>
        <button class="avatar-btn" id="btn-mic" title="Toggle voice">🎤</button>
    </div>

    <script type="module" src="avatar-app.js"></script>
</body>

</html>
